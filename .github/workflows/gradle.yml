name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          # jdk+fx, because this project uses JavaFX. A plain JDK would still
          # compile, since the JavaFX jars are declared as dependencies, but
          # matching the JDK developers use here keeps CI honest.
          java-package: jdk+fx

      - name: Build and check with Gradle
        # check runs the JUnit tests and both Checkstyle tasks, so a style
        # violation fails the build the same way a failing test does.
        run: ./gradlew check

      - name: Run the text UI tests
        # Not part of the Gradle build: runtest.sh drives the packaged app four
        # times and compares whole output against a saved file, which catches
        # things unit tests do not, such as a change to a reply's wording.
        # Unix only, since the Windows equivalent is a separate .bat script.
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}/text-ui-test
        run: ./runtest.sh
