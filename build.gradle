plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

checkstyle {
    // The rules live in config/checkstyle/checkstyle.xml, which is where the
    // plugin looks by default. They are the AddressBook Level 3 rules, which
    // encode the same SE-EDU standard the seedu-java-coding-standard skill
    // describes in prose.
    toolVersion = '14.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    // This project's chatbot is Goat, in the package goat, not the template's
    // seedu.duke.Duke. Gradle needs the fully qualified name so that `gradlew
    // run` and the JAR's manifest both start the right class.
    mainClass = 'goat.Goat'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'goat.jar'
}

run {
    // Goat reads commands from the terminal, and by default Gradle gives a
    // run task no standard input at all, so Ui's Scanner would see the input
    // end immediately and the app would greet, say goodbye and quit.
    standardInput = System.in
}
